# Servidor de la SPA (usuario no root, puerto 8080).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # SPA: cualquier ruta del router vuelve a index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # index.html y la configuración de ejecución nunca se cachean.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location = /assets/runtime-config.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Artefactos con hash de Angular (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css): caché larga.
  location ~* "-[A-Z0-9]{8}\.(js|css)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 'ok\n';
  }
}
