# Cabeceras de seguridad comunes. Se incluyen en cada location porque
# add_header no se hereda cuando la location define los suyos.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP generada en el arranque a partir de API_URL (docker/entrypoint.sh).
include /etc/nginx/generated/csp.conf;
