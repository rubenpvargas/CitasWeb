<div class="min-h-screen flex flex-col bg-surface text-on-surface">

  <!-- Contenedor de la Pantalla Activa -->
  <div class="flex-1 flex flex-col">
    <router-outlet />
  </div>

  <!-- Barra de Navegación Inferior (Portal) — opciones filtradas por rol -->
  @if (showPortalNav()) {
    <nav aria-label="Navegación principal" class="fixed bottom-0 w-full z-40 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)] border-t border-outline-variant/30">
      <div class="h-16 max-w-lg mx-auto px-2 flex items-center justify-around">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="text-primary font-semibold"
            #rla="routerLinkActive"
            ariaCurrentWhenActive="page"
            [class.text-on-surface-variant]="!rla.isActive"
            class="flex flex-col items-center justify-center min-w-[64px] min-h-[44px] py-1 transition-colors cursor-pointer border-0 bg-transparent"
          >
            @if (item.badge) {
              <div class="relative flex items-center justify-center">
                <span class="material-symbols-outlined text-[22px]" aria-hidden="true">{{ item.icon }}</span>
                <span class="absolute -top-1 -right-1.5 w-2 h-2 rounded-full bg-secondary"></span>
              </div>
            } @else {
              <span class="material-symbols-outlined text-[22px]" aria-hidden="true">{{ item.icon }}</span>
            }
            <span class="text-[11px] mt-0.5">{{ item.label }}</span>
          </a>
        }
      </div>
    </nav>
  }

</div>
